[project]
name = "uav-doctrine-corpus"
version = "0.1.0"
description = "Public-domain UAV/UAS doctrine corpus pipeline for SLM fine-tuning"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "rich>=13.7",
    "tinker>=0.22.0",
    "tinker-cookbook>=0.4.1",
    "transformers>=4.57.6",
    "tiktoken>=0.13.0",
    "datasets>=4.8.5",
    "pypdf>=6.12.1",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
]

[project.optional-dependencies]
clean = [
    "pypdf>=4.0",
    "marker-pdf>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
