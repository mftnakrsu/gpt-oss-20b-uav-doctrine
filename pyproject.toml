[project]
name = "uav-doctrine-corpus"
version = "0.1.0"
description = "Public-domain UAV/UAS doctrine corpus pipeline for SLM fine-tuning"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.optional-dependencies]
clean = [
    "pypdf>=4.0",
    "marker-pdf>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
